<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JGA Task Wheel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    canvas {
      display: block;
      background: white;
      border-radius: 50%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      height: auto;
      cursor: pointer;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff6b6b;
      margin-bottom: -5px;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.2));
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 12px 30px;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #spinBtn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      padding: 15px 50px;
      font-size: 1.2em;
    }

    #spinBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }

    #spinBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #confirmBtn {
      background: linear-gradient(135deg, #34a853 0%, #2d7e44 100%);
      color: white;
      display: none;
    }

    #confirmBtn.show {
      display: inline-block;
      animation: slideIn 0.4s ease;
    }

    #confirmBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(52, 168, 83, 0.4);
    }

    .result-text {
      color: white;
      font-size: 1.3em;
      margin-top: 15px;
      min-height: 30px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .description-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1em;
      margin-top: 10px;
      font-weight: normal;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      min-height: 20px;
    }

    .completed {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95em;
      margin-top: 10px;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .home-btn,
    .reset-btn {
      position: fixed;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      display: inline-block;
      font-weight: bold;
    }

    .home-btn {
      top: 20px;
      left: 20px;
      text-decoration: none;
    }

    .reset-btn {
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    }

    .home-btn:hover,
    .reset-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      button {
        padding: 10px 20px;
        font-size: 0.95em;
      }

      #spinBtn {
        padding: 12px 35px;
        font-size: 1em;
      }

      .result-text {
        font-size: 1.1em;
      }

      .home-btn {
        padding: 10px 15px;
        font-size: 0.9em;
        top: 15px;
        left: 15px;
      }

      .reset-btn {
        padding: 10px 15px;
        font-size: 0.9em;
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="home-btn">← Home</a>
  <button id="resetBtn" class="reset-btn">🔄 Reset</button>
  <div class="container">
    <h1>🎯 JGA Task Wheel</h1>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="500" height="500"></canvas>

      <div class="result-text" id="resultText"></div>
      <div class="description-text" id="descriptionText"></div>

      <div class="button-group">
        <button id="spinBtn">SPIN!</button>
        <button id="confirmBtn">✅ Erledigt und Foto/Video gemacht!</button>
      </div>
    </div>
  </div>

  <script>
    const tasks = [
      { name: 'Back Walker', color: '#FFB347', description: 'Laufe 2 Minuten rückwärts' },
      { name: 'Lucky Boi', color: '#4ECDC4', description: 'Erzähle verträumt einer fremden Person, wie geil heiraten ist' },
      { name: 'Naive Surprise', color: '#F38181', description: 'Lasse dir von einer fremden Person das nächste Getränk bestellen - auf Französisch' },
      { name: 'Love-drunken Poet', color: '#AA96DA', description: 'Verfasse ein Gedicht über Rebekka und trage es überglücklich vor' },
      { name: 'Sporty Dude', color: '#FCBAD3', description: 'Mache an jeder Kreuzung eine sportliche Übung deiner Wahl (z.B. 10 Liegestütze, 10 Kniebeugen, 10 Hampelmänner)' },
      { name: 'Medieval Drinker', color: '#FFD3B6', description: 'Navigiere uns zur nächsten Bar - mit einem Kompass' },
      { name: 'Treasure Seeker', color: '#FFAAA5', description: 'Frage ein älteres Ehepaar, was das Geheimnis einer langen Ehe ist' },
    ];

    let remainingTasks = [...tasks];
    let isSpinning = false;
    let currentRotation = 0;
    let selectedTask = null;
    let completedTasks = [];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const resultText = document.getElementById('resultText');
    const descriptionText = document.getElementById('descriptionText');
    const resetBtn = document.getElementById('resetBtn');

    // LocalStorage Funktionen
    function saveState() {
      const state = {
        remainingTaskNames: remainingTasks.map(t => t.name),
        completedTaskNames: completedTasks,
        currentRotation: currentRotation,
        selectedTaskName: selectedTask ? selectedTask.name : null
      };
      localStorage.setItem('jgaTasksState', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('jgaTasksState');
      if (saved) {
        const state = JSON.parse(saved);
        remainingTasks = state.remainingTaskNames.map(name =>
          tasks.find(t => t.name === name)
        ).filter(t => t);
        completedTasks = state.completedTaskNames;
        currentRotation = state.currentRotation;
        if (state.selectedTaskName) {
          selectedTask = tasks.find(t => t.name === state.selectedTaskName);
        }
      }
    }

    function resetAll() {
      if (confirm('Möchtest du alle erledigten Aufgaben zurücksetzen?')) {
        remainingTasks = [...tasks];
        completedTasks = [];
        currentRotation = 0;
        selectedTask = null;
        resultText.textContent = '';
        descriptionText.textContent = '';
        confirmBtn.classList.remove('show');
        spinBtn.disabled = false;
        spinBtn.textContent = 'SPIN!';
        saveState();
        drawWheel();
      }
    }

    // Canvas-Größe anpassen
    function resizeCanvas() {
      const size = Math.min(window.innerWidth - 40, 500);
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(centerX, centerY) - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const numSegments = remainingTasks.length;
      if (numSegments === 0) return;

      const anglePerSegment = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const startAngle = currentRotation + i * anglePerSegment;
        const endAngle = currentRotation + (i + 1) * anglePerSegment;

        // Segment zeichnen
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = remainingTasks[i].color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Text zeichnen
        const textAngle = startAngle + anglePerSegment / 2;
        const textX = centerX + Math.cos(textAngle) * (radius * 0.65);
        const textY = centerY + Math.sin(textAngle) * (radius * 0.65);

        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Text umbrechen wenn nötig
        const words = remainingTasks[i].name.split(' ');
        const maxWordsPerLine = 2;
        let line1 = '';
        let line2 = '';

        for (let j = 0; j < words.length; j++) {
          if (j < maxWordsPerLine) {
            line1 += words[j] + ' ';
          } else {
            line2 += words[j] + ' ';
          }
        }

        if (line2) {
          ctx.fillText(line1.trim(), textX, textY - 8);
          ctx.fillText(line2.trim(), textX, textY + 8);
        } else {
          ctx.fillText(line1.trim(), textX, textY);
        }

        ctx.restore();
      }
    }

    function spin() {
      if (isSpinning || remainingTasks.length === 0 || selectedTask !== null) return;

      isSpinning = true;
      spinBtn.disabled = true;
      confirmBtn.classList.remove('show');
      resultText.textContent = '';

      // Zufällige Aufgabe
      const randomIndex = Math.floor(Math.random() * remainingTasks.length);
      const targetIndex = randomIndex;

      const numSegments = remainingTasks.length;
      const anglePerSegment = (2 * Math.PI) / numSegments;

      // Berechne Zielwinkel: Die Mitte von Segment targetIndex sollte bei 3π/2 (oben) landen
      let targetAngle = (3 * Math.PI / 2) - (targetIndex + 0.5) * anglePerSegment;
      targetAngle = ((targetAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

      const spinDuration = 4000; // 4 Sekunden
      const startTime = Date.now();
      const startRotation = currentRotation;

      // Mehrere volle Rotationen + Zielwinkel
      let rotationDifference = targetAngle - startRotation;
      if (rotationDifference < 0) {
        rotationDifference += 2 * Math.PI;
      }
      const fullRotations = 5;
      const totalRotation = Math.PI * 2 * fullRotations + rotationDifference;

      function animateSpin() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);

        // Easing-Funktion (ease-out)
        const easeProgress = 1 - Math.pow(1 - progress, 3);

        currentRotation = startRotation + totalRotation * easeProgress;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          // Normalisiere currentRotation auf [0, 2π)
          currentRotation = ((currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          isSpinning = false;
          selectedTask = remainingTasks[targetIndex];
          showResult();
          spinBtn.disabled = true;
          saveState();
        }
      }

      animateSpin();
    }

    function showResult() {
      resultText.textContent = `🎯 ${selectedTask.name}`;
      descriptionText.textContent = selectedTask.description || '';
      confirmBtn.classList.add('show');
    }

    function confirmTask() {
      if (!selectedTask) return;

      completedTasks.push(selectedTask.name);
      // Entferne die erledigte Aufgabe aus dem Wheel
      remainingTasks = remainingTasks.filter(t => t.name !== selectedTask.name);

      selectedTask = null;
      confirmBtn.classList.remove('show');
      resultText.textContent = '';
      descriptionText.textContent = '';

      // Setze das Wheel auf eine zufällige Position
      if (remainingTasks.length > 0) {
        currentRotation = Math.random() * 2 * Math.PI;
      }

      drawWheel();
      saveState();

      if (remainingTasks.length > 0) {
        spinBtn.disabled = false;
      } else {
        spinBtn.disabled = true;
        spinBtn.textContent = '🎉 Alle Aufgaben erledigt!';
      }
    }

    spinBtn.addEventListener('click', spin);
    canvas.addEventListener('click', spin);
    confirmBtn.addEventListener('click', confirmTask);
    resetBtn.addEventListener('click', resetAll);
    window.addEventListener('resize', resizeCanvas);

    // Initial setup
    loadState();
    resizeCanvas();

    // Zeige das Ergebnis wenn es geladen wurde
    if (selectedTask) {
      resultText.textContent = `🎯 ${selectedTask.name}`;
      descriptionText.textContent = selectedTask.description || '';
      confirmBtn.classList.add('show');
      spinBtn.disabled = true;
    }
  </script>
</body>

</html>
