<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Wheel Spinner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    canvas {
      display: block;
      background: white;
      border-radius: 50%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      height: auto;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff6b6b;
      margin-bottom: -5px;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.2));
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 12px 30px;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #spinBtn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      padding: 15px 50px;
      font-size: 1.2em;
    }

    #spinBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }

    #spinBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mapsBtn {
      background: linear-gradient(135deg, #4285f4 0%, #1f6feb 100%);
      color: white;
      display: none;
    }

    #mapsBtn.show {
      display: inline-block;
      animation: slideIn 0.4s ease;
    }

    #mapsBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
    }

    .result-text {
      color: white;
      font-size: 1.3em;
      margin-top: 15px;
      min-height: 30px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    .home-btn,
    .reset-btn {
      position: fixed;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      display: inline-block;
      font-weight: bold;
    }

    .home-btn {
      top: 20px;
      left: 20px;
      text-decoration: none;
    }

    .reset-btn {
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    }

    .home-btn:hover,
    .reset-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      button {
        padding: 10px 20px;
        font-size: 0.95em;
      }

      #spinBtn {
        padding: 12px 35px;
        font-size: 1em;
      }

      .home-btn {
        padding: 10px 15px;
        font-size: 0.9em;
        top: 15px;
        left: 15px;
      }

      .reset-btn {
        padding: 10px 15px;
        font-size: 0.9em;
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="home-btn">← Home</a>
  <button id="resetBtn" class="reset-btn">🔄 Reset</button>
  <div class="container">
    <h1>🎡 Bar Wheel</h1>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="500" height="500"></canvas>

      <div class="result-text" id="resultText"></div>

      <div class="button-group">
        <button id="spinBtn">SPIN!</button>
        <button id="mapsBtn">📍 Navigieren</button>
      </div>
    </div>
  </div>

  <script>
    const options = [
      { name: 'Eisgrub-Bräu', mapsLink: 'ahsr67odEcxjjAiz9', color: '#FFB347' },
      { name: 'Spiritus', mapsLink: 'rvWHxPNoXRfjz54m7', color: '#FF6B6B' },
      { name: 'The Porter House', mapsLink: '1DznhjNyazncjhk58', color: '#8B4513' },
      { name: 'Waschmaschinensalon', mapsLink: 'oy1sWfTtDwink26G6', color: '#4ECDC4' },
      { name: 'Sixties', mapsLink: 'oz7CKt13LzcnzuhFA', color: '#95E1D3' },
      { name: 'Onkel Willis Pub', mapsLink: 'hA6jHvimxHs3Ge4c6', color: '#F38181' },
      { name: 'Eulchen Brauerei', mapsLink: 'kL9mNoPqRstuVwXyZ0', color: '#7CB342' },
      { name: 'Zur Andau', mapsLink: 'aBcDeFgHiJkLmNoPqR', color: '#AB47BC' },
      { name: 'Domsgickel', mapsLink: 'sTuVwXyZaBcDeFgHiJ', color: '#29B6F6' },
      { name: 'Stadthausschänke', mapsLink: 'kLmNoPqRsTuVwXyZaB', color: '#5D4037' }
    ];

    // Gezinkte Reihenfolge der Spins
    const spinOrder = [
      'Eisgrub-Bräu',
      'Spiritus',
      'The Porter House',
      'Waschmaschinensalon',
      'Sixties',
      'Onkel Willis Pub'
    ];

    let remainingOptions = [...options];
    let spinCount = 0;
    let isSpinning = false;
    let currentRotation = 0;
    let selectedOption = null;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const mapsBtn = document.getElementById('mapsBtn');
    const resultText = document.getElementById('resultText');
    const resetBtn = document.getElementById('resetBtn');

    // LocalStorage Funktionen
    function saveState() {
      const state = {
        remainingBarNames: remainingOptions.map(b => b.name),
        currentRotation: currentRotation,
        selectedBarName: selectedOption ? selectedOption.name : null,
        spinCount: spinCount
      };
      localStorage.setItem('barWheelState', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('barWheelState');
      if (saved) {
        const state = JSON.parse(saved);
        remainingOptions = state.remainingBarNames.map(name =>
          options.find(b => b.name === name)
        ).filter(b => b);
        currentRotation = state.currentRotation;
        spinCount = state.spinCount;
        if (state.selectedBarName) {
          selectedOption = options.find(b => b.name === state.selectedBarName);
        }
      }
    }

    function resetAll() {
      if (confirm('Möchtest du alle besuchten Bars zurücksetzen?')) {
        remainingOptions = [...options];
        spinCount = 0;
        currentRotation = 0;
        selectedOption = null;
        resultText.textContent = '';
        mapsBtn.classList.remove('show');
        spinBtn.disabled = false;
        spinBtn.textContent = 'SPIN!';
        saveState();
        drawWheel();
      }
    }

    // Canvas-Größe anpassen
    function resizeCanvas() {
      const size = Math.min(window.innerWidth - 40, 500);
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(centerX, centerY) - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const numSegments = remainingOptions.length;
      const anglePerSegment = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const startAngle = currentRotation + i * anglePerSegment;
        const endAngle = currentRotation + (i + 1) * anglePerSegment;

        // Segment zeichnen
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = remainingOptions[i].color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Text zeichnen
        const textAngle = startAngle + anglePerSegment / 2;
        const textX = centerX + Math.cos(textAngle) * (radius * 0.65);
        const textY = centerY + Math.sin(textAngle) * (radius * 0.65);

        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(remainingOptions[i].name, textX, textY);
        ctx.restore();
      }
    }

    function spin() {
      if (isSpinning || remainingOptions.length === 0 || selectedOption !== null) return;

      isSpinning = true;
      spinBtn.disabled = true;
      mapsBtn.classList.remove('show');
      resultText.textContent = '';

      // Bestimmte Option für diesen Spin
      const targetOptionName = spinOrder[spinCount];
      const targetIndex = remainingOptions.findIndex(opt => opt.name === targetOptionName);

      if (targetIndex === -1) {
        // Option wurde bereits entfernt
        spinCount++;
        isSpinning = false;
        spinBtn.disabled = false;
        return;
      }

      const numSegments = remainingOptions.length;
      const anglePerSegment = (2 * Math.PI) / numSegments;

      // Berechne Zielwinkel: Die Mitte von Segment targetIndex sollte bei 3π/2 (oben) landen
      // Mitte von Segment = currentRotation + (targetIndex + 0.5) * anglePerSegment = 3π/2
      // Also: targetAngle = 3π/2 - (targetIndex + 0.5) * anglePerSegment
      let targetAngle = (3 * Math.PI / 2) - (targetIndex + 0.5) * anglePerSegment;

      // Normalisiere targetAngle auf [0, 2π)
      targetAngle = ((targetAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

      const spinDuration = 4000; // 4 Sekunden
      const startTime = Date.now();
      const startRotation = currentRotation;

      // Mehrere volle Rotationen + Zielwinkel
      // Berechne die Rotationsdifferenz, stelle sicher dass wir in die richtige Richtung drehen
      let rotationDifference = targetAngle - startRotation;
      if (rotationDifference < 0) {
        rotationDifference += 2 * Math.PI;
      }
      const fullRotations = 5;
      const totalRotation = Math.PI * 2 * fullRotations + rotationDifference;

      function animateSpin() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);

        // Easing-Funktion (ease-out)
        const easeProgress = 1 - Math.pow(1 - progress, 3);

        currentRotation = startRotation + totalRotation * easeProgress;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          // Normalisiere currentRotation auf [0, 2π)
          currentRotation = ((currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          isSpinning = false;
          selectedOption = remainingOptions[targetIndex];
          spinCount++;
          showResult();
          spinBtn.disabled = true;
          saveState();
        }
      }

      animateSpin();
    }

    function showResult() {
      resultText.textContent = `🎉 ${selectedOption.name}!`;
      mapsBtn.classList.add('show');
    }

    function navigateToMaps() {
      if (!selectedOption) return;

      // window.open(`https://www.google.com/maps/search/${query}`, '_blank');
      window.open(`https://maps.app.goo.gl/${selectedOption.mapsLink}`, '_blank');

      // Option entfernen
      remainingOptions = remainingOptions.filter(opt => opt.name !== selectedOption.name);
      selectedOption = null;
      mapsBtn.classList.remove('show');
      resultText.textContent = '';

      // Setze das Wheel auf eine zufällige Position
      if (remainingOptions.length > 0) {
        currentRotation = Math.random() * 2 * Math.PI;
      }

      drawWheel();
      saveState();

      if (remainingOptions.length > 0) {
        spinBtn.disabled = false;
      } else {
        spinBtn.disabled = true;
        spinBtn.textContent = '✨ Alle Bars besucht!';
      }
    }

    spinBtn.addEventListener('click', spin);
    canvas.addEventListener('click', spin);
    mapsBtn.addEventListener('click', navigateToMaps);
    resetBtn.addEventListener('click', resetAll);
    window.addEventListener('resize', resizeCanvas);

    // Initial setup
    loadState();
    resizeCanvas();

    // Zeige das Ergebnis wenn es geladen wurde
    if (selectedOption) {
      resultText.textContent = `🎉 ${selectedOption.name}!`;
      mapsBtn.classList.add('show');
      spinBtn.disabled = true;
    }
  </script>
</body>

</html>
