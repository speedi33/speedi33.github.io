<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedi33 – Meine Projekte</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1117;
      --card: #1a1d26;
      --card-hover: #212533;
      --text: #e8eaf0;
      --muted: #9aa0ae;
      --accent: #667eea;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1c2340 0%, var(--bg) 55%);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header .avatar {
      font-size: 3.4em;
      line-height: 1;
      margin-bottom: 14px;
    }

    header h1 {
      font-size: 2.2em;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 1.05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 26px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    }

    .card .emoji {
      font-size: 2.6em;
      line-height: 1;
    }

    .card h2 {
      font-size: 1.35em;
      font-weight: 700;
    }

    .card .description {
      color: var(--muted);
      font-size: 0.95em;
      line-height: 1.55;
      flex-grow: 1;
    }

    .card .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card .tag {
      font-size: 0.78em;
      font-weight: 600;
      color: var(--accent);
      background: rgba(102, 126, 234, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .card .links {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .card .link {
      font-size: 0.85em;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .card .link.primary {
      background: var(--accent);
      color: #fff;
    }

    .card .link.primary:hover {
      background: #5369d8;
    }

    .card .link.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .card .link.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85em;
    }

    @media (max-width: 640px) {
      body {
        padding: 40px 16px 24px;
      }

      header h1 {
        font-size: 1.7em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="avatar">👨‍💻</div>
      <h1>Meine Projekte</h1>
      <p>Eine Auswahl meiner Projekte – viel Spaß beim Stöbern!</p>
    </header>

    <main class="grid" id="projectGrid"></main>

    <footer>
      © <span id="year"></span> speedi33 · Diese Seite wird mit GitHub Pages gehostet
    </footer>
  </div>

  <script>
    // Zentral gepflegte Links – hier einfach die URLs anpassen.
    const LINKS = {
      jga: 'https://speedi33.github.io/jga/',
      jgaGithub: 'https://github.com/speedi33/jga',
      foodReminder: 'https://speedi33.github.io/FoodReminder/',
      foodReminderGitHub: 'https://github.com/speedi33/FoodReminder',
      eatweekly: 'https://speedi33.github.io/Eatweekly/',
      eatweeklyGitHub: 'https://github.com/speedi33/Eatweekly',
    };

    // Neue Projekte einfach hier hinzufügen.
    const PROJECTS = [
      {
        emoji: '🎉',
        title: 'JGA',
        description:
          'Web-App für einen legendären Junggesellenabschied: Bar Wheel für die nächste Bar und Task Wheel mit Challenges.',
        tags: ['HTML', 'CSS', 'JS'],
        url: LINKS.jga,
        github: LINKS.jgaGithub,
      },
      {
        emoji: '🥕',
        title: 'FoodReminder',
        description:
          'App für iOS, Android und Web, die Lebensmittel und Kassenbons erfasst und rechtzeitig an das Mindesthaltbarkeitsdatum erinnert.',
        tags: ['React Native', 'Expo', 'TypeScript'],
        url: LINKS.foodReminder,
        github: LINKS.foodReminderGitHub,
      },
      {
        emoji: '🍽️',
        title: 'Eatweekly',
        description:
          'Wochenplan-App für iOS, Android und Web: Rezepte verwalten, den Wochenplan planen und automatisch eine Einkaufsliste generieren.',
        tags: ['Flutter', 'Firebase', 'Dart'],
        url: LINKS.eatweekly,
        github: LINKS.eatweeklyGitHub,
      },
    ];

    const grid = document.getElementById('projectGrid');

    for (const project of PROJECTS) {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = project.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const tags = project.tags
        .map((tag) => `<span class="tag">${tag}</span>`)
        .join('');

      const links = [];
      if (project.url) {
        links.push(
          `<span class="link primary">Öffnen</span>`
        );
      }
      if (project.github && project.github !== project.url) {
        links.push(`<a class="link secondary" href="${project.github}" target="_blank" rel="noopener noreferrer">GitHub</a>`);
      }

      card.innerHTML = `
        <div class="emoji">${project.emoji}</div>
        <h2>${project.title}</h2>
        <p class="description">${project.description}</p>
        <div class="tags">${tags}</div>
        <div class="links">${links.join('')}</div>
      `;

      grid.appendChild(card);
    }

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
